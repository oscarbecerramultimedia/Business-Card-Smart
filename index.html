<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OscarBecerra - Contacto</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #000; color: white; text-align: center; margin: 0; padding: 0; }
        
        /* ==========================================
           ESTILOS DEL SPLASH SCREEN (PANTALLA DE CARGA)
           ========================================== */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000; /* Fondo negro */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Asegura superposición absoluta */
            transition: opacity 0.5s ease-out; /* Transición de desvanecimiento */
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Evita deformaciones o recortes del wallpaper */
            max-width: 100%;
            max-height: 100%;
        }

        /* Control de visibilidad del árbol de links */
        #main-content {
            opacity: 1;
            transition: opacity 0.5s ease-in;
        }

        #main-content.hidden {
            display: none;
            opacity: 0;
        }

        /* ==========================================
           ESTILOS ORIGINALES DEL REPOSITORIO
           ========================================== */
        .logo-slider { 
            width: auto; 
            max-width: 90%; 
            height: auto; 
            max-height: 250px; 
            margin: 10px auto; 
            display: block; 
            border: 2px solid #194f68; 
            border-radius: 12px; 
            box-sizing: border-box; 
            position: relative;
            overflow: hidden;
        }

        .logo-slider img {
            width: 100%;
            height: auto;
            max-height: 250px;
            display: block;
            object-fit: contain;
        }

        .logo-slider img.slide-extra {
            position: absolute;
            top: 0;
            left: 0;
        }

        .logo-slider img {
            opacity: 0;
            animation: carruselBanner 12s infinite ease-in-out;
        }

        .logo-slider img:nth-child(1) { animation-delay: 0s; }
        .logo-slider img:nth-child(2) { animation-delay: 4s; }
        .logo-slider img:nth-child(3) { animation-delay: 8s; }

        @keyframes carruselBanner {
            0% { opacity: 0; }
            5% { opacity: 1; }
            33% { opacity: 1; }
            38% { opacity: 0; }
            100% { opacity: 0; }
        }

        .contenedor { display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }
        .boton { 
            background: #1a1a1a; 
            border: 2px solid #194f68; 
            border-radius: 12px; 
            padding: 5px; 
            margin: 5px;  
            width: 85%; 
            max-width: 350px; 
            text-decoration: none; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            font-size: 0.9rem; 
        }
        .boton img { 
            width: 35px; 
            height: 35px; 
            object-fit: contain; 
            margin: 0 15px; 
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.3));
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="SplashScreenOBM.webp" alt="Splash Screen OBM">
    </div>

    <div id="main-content" class="hidden">
        <div class="contenedor">
            
            <div class="logo-slider">
                <img src="FondoFrontRepos.png">
                <img src="FondoFrontRepos2.png" class="slide-extra">
                <img src="FondoFrontRepos3.png" class="slide-extra">
            </div>

            <a href="tel:+573172691523" class="boton">
                <img src="IcoLlamar2.png"> Llamar
            </a>
            
            <a href="https://wa.me/573172691523?text=Gracias%20por%20comunicarte%20con%20Oscar%20Becerra%Artista%Digital%20en%20breve%20me%20comunicare%20contigo" class="boton">
                <img src="IcoWhatsApp.png"> WhatsApp
            </a>
          
            <a href="https://www.facebook.com/profile.php?id=61567628995129" class="boton">
                <img src="IcoFacebook.png"> Facebook
            </a>

            <a href="https://www.tiktok.com/@hozkar17" class="boton">
                <img src="IcoTikTok.png"> TikTok
            </a>

            <a href="https://www.instagram.com/oscarbecerramultimedia/" class="boton">
                <img src="IcoInstagram.png"> Instagram
            </a>
            
            <a href="mailto:oscarbecerramultimedia@gmail.com" class="boton">
                <img src="IcoEmail.png"> Correo Electrónico
            </a>

            <a href="#" class="boton">
                <img src="IcoCatalogo.png"> Catálogo
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splash = document.getElementById("splash-screen");
            const content = document.getElementById("main-content");

            // Temporizador configurado en 3500 milisegundos (3.5 segundos)
            const tiempoEspera = 3500; 

            setTimeout(() => {
                // Ejecuta la transición CSS de opacidad
                splash.style.opacity = 0;
                
                // Hace visible el árbol de enlaces inmediatamente
                content.classList.remove("hidden");

                // Remueve el contenedor del flujo estructural tras la transición
                setTimeout(() => {
                    splash.style.display = "none";
                }, 500); 

            }, tiempoEspera);
        });
    </script>
</body>
</html>
