<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OscarBecerra - Contacto</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #000; color: white; text-align: center; margin: 0; padding: 0; }
        
        /* 1. Mantenemos tu caja con tus medidas responsivas exactas */
        .logo-slider { 
            width: auto; 
            max-width: 90%; 
            height: auto; 
            max-height: 250px; 
            margin: 10px auto; 
            display: block; 
            border: 2px solid #194f68; 
            border-radius: 12px; 
            box-sizing: border-box; 
            position: relative;
            overflow: hidden;
        }

        /* 2. Hacemos que la primera imagen dicte el tamaño automático en Android */
        .logo-slider img {
            width: 100%;
            height: auto;
            max-height: 250px;
            display: block;
            object-fit: contain;
        }

        /* 3. Las imágenes extra se posicionan encima sin alterar el tamaño */
        .logo-slider img.slide-extra {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 4. Animación de desvanecimiento manteniendo la proporción */
        .logo-slider img {
            opacity: 0;
            animation: carruselBanner 12s infinite ease-in-out;
        }

        .logo-slider img:nth-child(1) { animation-delay: 0s; }
        .logo-slider img:nth-child(2) { animation-delay: 4s; }
        .logo-slider img:nth-child(3) { animation-delay: 8s; }

        @keyframes carruselBanner {
            0% { opacity: 0; }
            5% { opacity: 1; }
            33% { opacity: 1; }
            38% { opacity: 0; }
            100% { opacity: 0; }
        }

        .contenedor { display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }
        .boton { 
            background: #1a1a1a; 
            border: 2px solid #194f68; 
            border-radius: 12px; 
            padding: 5px; 
            margin: 5px;  
            width: 85%; 
            max-width: 350px; 
            text-decoration: none; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            font-size: 0.9rem; 
        }
        .boton img { 
            width: 35px; 
            height: 35px; 
            object-fit: contain; 
            margin: 0 15px; 
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.3));
        }
    </style>
</head>
<body>
    <div class="contenedor">
        
        <!-- Contenedor con tus ajustes de tamaño originales -->
        <div class="logo-slider">
            <img src="FondoFrontRepos.png">
            <img src="FondoFrontRepos2.png" class="slide-extra">
            <img src="FondoFrontRepos3.png" class="slide-extra">
        </div>

        <a href="tel:+573172691523" class="boton">
            <img src="IcoLlamar2.png"> Llamar
        </a>
        
        <a href="https://wa.me/573172691523?text=Gracias%20por%20comunicarte%20con%20Oscar%20Becerra%Artista%Digital%20en%20breve%20me%20comunicare%20contigo" class="boton">
            <img src="IcoWhatsApp.png"> WhatsApp
        </a>
      
        <a href="https://www.facebook.com/profile.php?id=61567628995129" class="boton">

</body>
</html>
