<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OscarBecerra - Contacto</title>
    <style>
        /* ==========================================
           1. CONFIGURACIÓN GLOBAL (PULL-TO-REFRESH)
           ========================================== */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            min-height: 100dvh; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            overflow-x: hidden;      
            overflow-y: auto;        /* Habilita el gesto de arrastrar para refrescar */
        }
        
        /* ==========================================
           2. ESTILOS DEL SPLASH SCREEN (RESPONSIVO)
           ========================================== */
        #splash-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100dvh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
            overflow: hidden;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Forzado vertical completo sin cortes */
            display: block;
        }

        /* CONTROL DE VISIBILIDAD */
        #main-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            opacity: 1;
            transition: opacity 0.5s ease-in;
        }

        #main-content.hidden {
            display: none;
            opacity: 0;
        }

        /* REGLA RESPONSIVA PARA WINDOWS (CENTRADOS Y PROPORCIÓN) */
        @media (min-width: 768px) {
            .contenedor, #splash-screen {
                height: 100dvh !important;
                width: calc(100dvh * 540 / 1200) !important;
                max-width: 100vw;
                box-shadow: 0 0 15px rgba(255,255,255,0.1);
            }
        }

        /* ==========================================
           3. ESTILOS ORIGINALES DEL REPOSITORIO
           ========================================== */
        .contenedor { 
            width: 100vw;
            min-height: 100dvh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-bottom: 20px; 
            box-sizing: border-box;
            overflow: hidden;   
            font-family: Arial, sans-serif; 
            background-color: #000; 
            color: white; 
            text-align: center;
        }

        .logo-slider { 
            width: auto; 
            max-width: 90%; 
            height: auto; 
            max-height: 250px; 
            margin: 10px auto; 
            display: block; 
            border: 2px solid #194f68; 
            border-radius: 12px; 
            box-sizing: border-box; 
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-slider img {
            width: 100%;
            height: auto;
            max-height: 250px;
            display: block;
            object-fit: contain;
        }

        .logo-slider img.slide-extra {
            position: absolute;
            top: 0;
            left: 0;
        }

        .logo-slider img {
            opacity: 0;
            animation: carruselBanner 12s infinite ease-in-out;
        }

        .logo-slider img:nth-child(1) { animation-delay: 0s; }
        .logo-slider img:nth-child(2) { animation-delay: 4s; }
        .logo-slider img:nth-child(3) { animation-delay: 8s; }

        @keyframes carruselBanner {
            0% { opacity: 0; }
            5% { opacity: 1; }
            33% { opacity: 1; }
            38% { opacity: 0; }
            100% { opacity: 0; }
        }

        .boton { 
            background: #1a1a1a; 
            border: 2px solid #194f68; 
            border-radius: 12px; 
            padding: 5px; 
            margin: 5px;  
            width: 85%; 
            max-width: 350px; 
            text-decoration: none; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            font-size: 0.9rem; 
            flex-shrink: 0;
            box-sizing: border-box;
        }
        
        .boton img { 
            width: 35px; 
            height: 35px; 
            object-fit: contain; 
            margin: 0 15px; 
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.3));
        }
    </style>
</head>
<body>

    <!-- Bloque Splash Screen responsivo -->
    <div id="splash-screen">
        <img src="SplashScreenOBM.webp" alt="Splash Screen OBM">
    </div>

    <!-- Contenedor de contenido centrado -->
    <div id="main-content" class="hidden">
        <div class="contenedor">
            
            <div class="logo-slider">
                <img src="FondoFrontRepos.png">
                <img src="FondoFrontRepos2.png" class="slide-extra">
                <img src="FondoFrontRepos3.png" class="slide-extra">
            </div>

            <a href="tel:+573172691523" class="boton">
                <img src="IcoLlamar2.png"> Llamar
            </a>
            
            <a href="https://wa.me/573172691523?text=Gracias%20por%20comunicarte%20con%20Oscar%20Becerra%Artista%Digital%20en%20breve%20me%20comunicare%20contigo" class="boton">
                <img src="IcoWhatsApp.png"> WhatsApp
            </a>
          
            <a href="https://www.facebook.com/profile.php?id=61567628995129" class="boton">
                <img src="IcoFacebook.png"> Facebook
            </a>

            <a href="https://www.tiktok.com/@hozkar17" class="boton">
                <img src="IcoTikTok.png"> TikTok
            </a>

            <a href="https://www.instagram.com/oscarbecerramultimedia/" class="boton">
                <img src="IcoInstagram.png"> Instagram
            </a>
            
            <a href="mailto:oscarbecerramultimedia@gmail.com" class="boton">
                <img src="IcoEmail.png"> Correo Electrónico
            </a>

            <a href="#" class="boton">
                <img src="IcoCatalogo.png"> Catálogo
            </a>
        </div>
    </div>

    <!-- Script de Temporización y Refresco -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splash = document.getElementById("splash-screen");
            const content = document.getElementById("main-content");
            const tiempoEspera = 2500; 

            setTimeout(() => {
                splash.style.opacity = 0;
                content.classList.remove("hidden");

                setTimeout(() => {
                    splash.style.display = "none";
                }, 500); 
            }, tiempoEspera);
        });
    </script>
</body>
</html>
