<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo RV</title>
<style>
/* 1. RESET Y BASE GENERAL */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =======================================================
   ESTILOS DEL SPLASH SCREEN (SINCRONIZADO AL CONTENEDOR)
   ======================================================= */
#splash-screen {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* Lo centra perfectamente en Windows y Android */
    width: 100vw;                     /* En móvil usa el 100% del ancho */
    height: 100dvh;                   /* En móvil usa el 100% del alto dinámico */
    background: #ffffff;              /* Fondo base del splash */
    z-index: 9999;                    /* Por encima de todo el contenido */
    overflow: hidden;
    transition: opacity 0.5s ease-out; /* Efecto de desvanecimiento */
}

#splash-screen img {
    width: 100%;
    height: 100%;
    object-fit: fill;                 /* Se ajusta por completo al formato vertical sin cortes */
    display: block;
}

/* Control de visibilidad para el contenedor del catálogo */
#main-content {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 1;
    transition: opacity 0.5s ease-in;
}

#main-content.hidden {
    display: none;
    opacity: 0;
}

/* =======================================================
   REGLAS ORIGINALES DEL CONTENEDOR Y ELEMENTOS
   ======================================================= */
.contenedor {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    container-type: size;
}

/* APLICACIÓN DE MEDIDAS IDÉNTICAS PARA WINDOWS (ESCRITORIO) */
@media (min-width: 768px) {
    .contenedor, #splash-screen {
        height: 100dvh;
        width: calc(100dvh * 540 / 1200); /* Restringe el splash al mismo ancho vertical del catálogo */
        max-width: 100vw;
        box-shadow: 0 0 15px rgba(0,0,0,0.2); 
    }
}

/* FONDO Y BOTÓN INTERNO */
.fondo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    z-index: 1;
}

.boton-catalogo {
    position: absolute;
    top: 45%;
    left: 52%;
    transform: translate(-50%, -50%);
    width: min(35%, 260px);
    z-index: 2;
}

.boton-catalogo img {
    width: 100%;
    height: auto;
    display: block;
}

/* NUEVO BOTÓN PERIFÉRICO */
.btn-periferico {
    position: absolute;
    z-index: 4;
}

.btn-periferico img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.logo-obm {
    bottom: 0%;
    left: 21%;
    width: 60%;
    aspect-ratio: 836 / 213;
}
</style>
</head>
<body>

<!-- Pantalla de carga con la misma lógica responsiva -->
<div id="splash-screen">
    <img src="SplashScreenOBM.webp" alt="Cargando Catálogo">
</div>

<!-- Contenedor del contenido que inicia oculto -->
<div id="main-content" class="hidden">
    <div class="contenedor">
        <img class="fondo" src="imagenes/fondos/ImagFondoPortada.webp" alt="Portada">
        
        <a href="categorias.html" class="boton-catalogo">
            <img src="imagenes/botones/ImagBotPortada.webp" alt="Catálogo">
        </a>

        <a href="https://oscarbecerramultimedia.github.io/Business-Card-Smart/" class="btn-periferico logo-obm" target="_blank" title="OBM Multimedia">
            <img src="imagenes/botones/ImagBotLogoOBM.webp" alt="Logo OBM">
        </a>
    </div>
</div>

<!-- Control de temporización y refresco -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const splash = document.getElementById("splash-screen");
        const content = document.getElementById("main-content");
        const tiempoEspera = 3500; // Duración de 3.5 segundos

        setTimeout(() => {
            splash.style.opacity = 0;
            content.classList.remove("hidden");

            setTimeout(() => {
                splash.style.display = "none";
            }, 500); 
        }, tiempoEspera);
    });
</script>

</body>
</html>
